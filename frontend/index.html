<!doctype html>
<html lang="fr" data-atelier-app="viz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Viz</title>
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Aucune ressource externe : l'application fonctionne hors ligne (pile de polices du système). -->
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair → sombre) :
      // classe « dark » et data-theme, comme useTheme (docs/SUITE.md §1.5).
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
