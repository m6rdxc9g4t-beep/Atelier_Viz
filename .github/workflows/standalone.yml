# Application autonome (PyInstaller) : construction sur macOS, Windows et Linux, auto-test du paquet
# produit (serveur local + interface compilée + exemples, sans fenêtre), archives en artefacts.
# Rien à installer chez l'utilisateur : ni Python, ni conda, ni Node.
name: Application autonome

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "scripts/standalone/**"
      - "backend/app/standalone.py"
      - "backend/standalone.py"
      - "backend/requirements*.txt"
      - ".github/workflows/standalone.yml"
  pull_request:
    paths:
      - "scripts/standalone/**"
      - "backend/app/standalone.py"
      - "backend/standalone.py"
      - ".github/workflows/standalone.yml"

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construction et auto-test
        run: python scripts/standalone/build.py --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: atelier-viz-${{ runner.os }}
          path: |
            dist-standalone/*.zip
            dist-standalone/*.tar.gz
          if-no-files-found: error
          retention-days: 14
