[project]
name = "atelier-viz-backend"
version = "0.1.0"
description = "Backend FastAPI d'Atelier Viz (BI) : données, IA hybride Ollama/Claude, GitHub, export PPTX."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
